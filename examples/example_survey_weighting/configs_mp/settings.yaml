####################################################################
# PopulationSim Properties - multiprocess overlay
####################################################################
#
# Overlay for examples/example_survey_weighting/configs. Everything not
# repeated here is backfilled from that directory (inherit_settings).
#
# This example has no sub-geography below the seed geography, so there is no
# sub_balancing step to parallelize. Instead we slice on the seed geography
# itself (SUBREGCluster): every control in controls.csv is a SUBREGCluster
# control, so the seed zones are balanced independently of one another and
# splitting them across processes is equivalent to the serial loop over
# seed_ids in initial_seed_balancing.

inherit_settings: True

multiprocess: True
num_processes: 2

# the base settings use the legacy 'run_list: steps:' group; blank it out here
# so run.py does not trip over having both run_list.steps and models
run_list:

slice_geography: SUBREGCluster

# Steps for base mode
# ------------------------------------------------------------------
models:
  ### mp_setup step (single process)
  - input_pre_processor
  - setup_data_structures
  ### mp_seed_balancing step (one process per slice of seed zones)
  - initial_seed_balancing
  - meta_control_factoring
  - final_seed_balancing
  ### mp_summarize step (single process)
  - summarize
  - write_tables

resume_after:

multiprocess_steps:
  - name: mp_setup
    begin: input_pre_processor
  - name: mp_seed_balancing
    begin: initial_seed_balancing
    num_processes: 2
    slice:
      # slice_crosswalk is the primary slicer (indexed by SUBREGCluster);
      # crosswalk, incidence_table, households and persons all cascade from it
      tables:
        - slice_crosswalk
        - crosswalk
        - incidence_table
        - households
        - persons
      # don't slice any tables not explicitly listed above (control tables,
      # control_spec, household_groups, ...)
      except: True
      # tables created by the sub-processes that must be concatenated back
      coalesce:
        - SUBREGCluster_weights
  - name: mp_summarize
    begin: summarize

output_tables:
  action: include
  prefix: ''
  tables:
    - summary_SUBREGCluster
    - summary_hh_weights
    - incidence_table
    - SUBREGCluster_weights
